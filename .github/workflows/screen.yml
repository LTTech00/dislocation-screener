name: screen

on:
  schedule:
    # Ogni 3 ore nei giorni feriali. Il giro delle 23:00 UTC resta quello
    # "buono": e' l'unico momento in cui USA, Europa e Asia hanno tutti
    # chiuso, quindi l'unico in cui i percentili di settore confrontano
    # prezzi nello stesso stato. Gli altri sette servono a vedere i
    # movimenti durante il giorno, non a produrre candidati migliori.
    # Nota: il cron di GitHub non e' puntuale, puo' slittare di 5-30 minuti.
    - cron: "0 */3 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Trigger: and (severo) / or (permissivo)"
        type: choice
        options: [and, or]
        default: and
      fast:
        description: "Fondamentali solo per chi passa il trigger"
        type: boolean
        default: false
      allow_empty:
        description: "Pubblica anche con zero candidati"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Una run alla volta. Due pipeline concorrenti sullo stesso IP
# sono il modo piu' rapido per farsi bloccare da Yahoo.
concurrency:
  group: screen
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      publishable: ${{ steps.publish.outputs.publishable }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # curl_cffi imita il fingerprint TLS di Chrome: senza, Yahoo
          # riconosce il runner come bot quasi subito
          pip install "curl_cffi>=0.7"

      # La cache e' la differenza fra una run da 20 minuti e una da 2 ore,
      # e soprattutto fra passare inosservati e prendersi un 429.
      # Restore/save separati con if:always() cosi' il lavoro fatto
      # sopravvive anche a una run parzialmente fallita.
      - name: Ripristina cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache
            output
          key: screener-${{ github.run_id }}
          restore-keys: screener-

      - name: Controllo offline
        run: python -m screener.selftest

      # --force-prices e' obbligatorio con la cadenza a 3 ore: la cache
      # prezzi e' UN FILE AL GIORNO, quindi senza il flag i giri dal
      # secondo in poi rileggerebbero il pickle di stamattina e
      # ripubblicherebbero una pagina identica. Costa ~6 richieste
      # (batch da 80 ticker), non 452: il resto arriva dalle cache
      # con TTL proprio (fondamentali 7 giorni, stime e notizie 20 ore).
      - name: Screen
        env:
          SCREENER_PACING: "3.0"     # in CI si va piano di proposito
        run: |
          python -m screener.run_screen \
            --mode "${{ inputs.mode || 'and' }}" \
            --force-prices \
            ${{ inputs.fast && '--fast' || '' }}

      - name: Salva cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .cache
            output
          key: screener-${{ github.run_id }}

      - name: Verifica e prepara il sito
        id: publish
        run: |
          set +e
          python -m screener.publish --site site --keep 60 \
            ${{ inputs.allow_empty && '--allow-empty' || '' }}
          code=$?
          set -e
          case $code in
            0) echo "publishable=true"  >> "$GITHUB_OUTPUT" ;;
            2) echo "publishable=false" >> "$GITHUB_OUTPUT"
               echo "::notice::Zero candidati oltre il trigger: mercato calmo, nessuna pubblicazione." ;;
            *) echo "publishable=false" >> "$GITHUB_OUTPUT"
               echo "::error::Dati insufficienti — resta online la versione precedente."
               exit 1 ;;
          esac

      - name: Sommario
        if: always()
        run: |
          {
            echo "### Screen del $(date -u +%F)"
            if [ -f site/status.json ]; then
              echo '```json'; cat site/status.json; echo '```'
            else
              echo "Nessuno status prodotto: la pipeline si e' fermata prima."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        if: steps.publish.outputs.publishable == 'true'
        with:
          path: site

  deploy:
    needs: run
    if: needs.run.outputs.publishable == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
